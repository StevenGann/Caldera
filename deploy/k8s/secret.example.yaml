# Copy to secret.yaml and fill in (DO NOT commit the filled-in copy).
#   kubectl -n caldera apply -f secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: caldera-secrets
  namespace: caldera
type: Opaque
stringData:
  # Comma-separated Bearer API keys accepted by the REST API and MCP server.
  CALDERA_API_KEYS: "replace-with-a-long-random-key"
  # GitHub PAT with repo scope for the private vault.
  CALDERA_GITHUB_TOKEN: "ghp_xxxxxxxxxxxxxxxxxxxx"
